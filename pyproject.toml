[tool.poetry]
name = "rag"
version = "0.1.0"
description = "RAG (Retrieval Augmented Generation) system for educational purposes"
authors = ["Lucas Bruzzone <lucas.rbruzzone@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
langchain = "^0.3.7"
langchain-community = "^0.3.5"
chromadb = "^0.4.24"
pysqlite3-binary = "^0.5.2"
sentence-transformers = "^2.3.1"
pypdf = "^4.0.1"
python-docx = "^1.1.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.1"
tiktoken = "^0.5.2"
arize-phoenix = {version = "^4.0.0", extras = ["evals"], optional = true}
openinference-instrumentation-langchain = {version = "^0.1.19", optional = true}

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
black = "^24.1.1"
pytest = "^8.0.0"
ipykernel = "^6.29.0"

[tool.poetry.extras]
telemetry = ["arize-phoenix", "openinference-instrumentation-langchain"]

[tool.poetry.scripts]
rag = "cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | db
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"